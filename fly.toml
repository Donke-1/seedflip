# fly.io app config for SeedFlip.
#
# Deploys the FastAPI backend + bundled React frontend in a single VM with a
# 1 GB persistent volume mounted at /data for the Solana wallet keypair and
# SQLite database.
#
# Region: ams (Amsterdam) — chosen for low latency to Jupiter, Helius, and
# DexScreener public APIs (all of which front in EU/US). Change with
# `fly regions set <region>` if you prefer.

app = "seedflip"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # All risk-sensitive flags (LIVE_TRADING_ARMED, SOLANA_RPC_URL) are stored
  # as fly secrets, NOT here. `fly secrets list` to inspect.

[[mounts]]
  source = "seedflip_data"
  destination = "/data"
  initial_size = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # bot must stay up 24/7 during the 7-day run
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
