[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.136.1"}
psycopg = {extras = ["binary"], version = "^3.3.4"}
httpx = "^0.28.1"
numpy = "^2.4.5"
pandas = "^3.0.3"
pydantic-settings = "^2.14.1"
sqlmodel = "^0.0.38"
aiosqlite = "^0.22.1"
solana = "^0.36.12"
solders = "^0.27.1"
base58 = "^2.1.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
ruff = "^0.15.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E702 (semicolons grouping struct-like field defaults) is a deliberate stylistic
# choice in the simulator/strategy_config; allow it project-wide.
ignore = ["E702", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
